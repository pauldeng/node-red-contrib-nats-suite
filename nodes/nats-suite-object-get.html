<script type="text/javascript">
  RED.nodes.registerType('nats-suite-object-get', {
    category: 'NATS Suite',
    color: '#2FAF9C',
    icon: 'nats-icon-white.png',
    align: 'left',
    defaults: {
      name: { value: "" },
      server: { value: "", type: 'nats-suite-server', required: true },
      bucket: { value: "" },
      bucketConfig: { value: "", required: false },
      objectName: { value: "" },
      nameFrom: { value: "msg" },
      outputFormat: { value: "buffer" },
      description: { value: "" },
      maxAge: { value: 0 },
      maxBytes: { value: 0 },
      storage: { value: "file" },
      replicas: { value: 1 },
      compression: { value: false },
      debug: { value: false },
      operation: { value: 'get' }
    },
    inputs: 1,
    outputs: 1,
    label: function () {
      return this.name || "object get";
    },
    paletteLabel: 'nats object get',
    oneditprepare: function() {
      // Operation handler
      $('#node-input-operation').on('change', function() {
        if ($(this).val() === 'list') {
          $('#object-config').slideUp(200);
        } else {
          $('#object-config').slideDown(200);
        }
      });
      
      // Name source handler
      $('#node-input-nameFrom').on('change', function() {
        if ($(this).val() === 'config') {
          $('#object-name-row').slideDown(200);
        } else {
          $('#object-name-row').slideUp(200);
        }
      });
      
      // Bucket config handler
      $('#node-input-bucketConfig').on('change', function() {
        if ($(this).val()) {
          $('#bucket-direct-config').slideUp(200);
        } else {
          $('#bucket-direct-config').slideDown(200);
        }
      });
      
      $('#node-input-operation').trigger('change');
      $('#node-input-nameFrom').trigger('change');
      $('#node-input-bucketConfig').trigger('change');
    }
  });
</script>

<script type="text/x-red" data-template-name="nats-suite-object-get">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Optional display name">
  </div>
  <div class="form-row">
    <label for="node-input-server"><i class="fa fa-server"></i> NATS Server</label>
    <input type="text" id="node-input-server">
  </div>
  <div class="form-row">
    <label for="node-input-bucketConfig"><i class="fa fa-database"></i> Bucket Config (optional)</label>
    <input type="text" id="node-input-bucketConfig" style="width:70%">
  </div>
  <div id="bucket-direct-config">
    <div class="form-row">
      <label for="node-input-bucket"><i class="fa fa-database"></i> Bucket Name</label>
      <input type="text" id="node-input-bucket" placeholder="my-bucket" style="width:70%">
    </div>
    <div class="form-row">
      <label for="node-input-description"><i class="fa fa-info-circle"></i> Description</label>
      <input type="text" id="node-input-description" style="width:70%">
    </div>
    <div class="form-row">
      <label for="node-input-maxAge"><i class="fa fa-clock-o"></i> Max Age (s)</label>
      <input type="number" id="node-input-maxAge" min="0" style="width:70%">
    </div>
    <div class="form-row">
      <label for="node-input-maxBytes"><i class="fa fa-hdd-o"></i> Max Bytes</label>
      <input type="number" id="node-input-maxBytes" min="0" style="width:70%">
    </div>
    <div class="form-row">
      <label for="node-input-storage"><i class="fa fa-database"></i> Storage</label>
      <select id="node-input-storage" style="width:70%">
        <option value="file">File</option>
        <option value="memory">Memory</option>
      </select>
    </div>
    <div class="form-row">
      <label for="node-input-replicas"><i class="fa fa-copy"></i> Replicas</label>
      <input type="number" id="node-input-replicas" min="1" style="width:70%">
    </div>
    <div class="form-row">
      <label for="node-input-compression"> </label>
      <label for="node-input-compression" style="width:70%">
        <input type="checkbox" id="node-input-compression" style="display:inline-block; width:22px; vertical-align:top;">Enable Compression
      </label>
    </div>
  </div>
  <div class="form-row">
    <label for="node-input-debug"> </label>
    <label for="node-input-debug" style="width:70%">
      <input type="checkbox" id="node-input-debug" style="display:inline-block; width:22px; vertical-align:top;">Enable Debug Logging
    </label>
  </div>

  <h4>Operation</h4>
  <div class="form-row">
    <label for="node-input-operation"><i class="fa fa-cogs"></i> Operation</label>
    <select id="node-input-operation" style="width:70%">
      <option value="get">Get Object</option>
      <option value="list">List Objects</option>
    </select>
  </div>

  <div id="object-config">
    <div class="form-row">
      <label for="node-input-nameFrom"><i class="fa fa-key"></i> Object Name From</label>
      <select id="node-input-nameFrom" style="width:70%">
        <option value="msg">msg.objectName / msg.name</option>
        <option value="topic">msg.topic</option>
        <option value="config">Configuration</option>
      </select>
    </div>
    <div class="form-row" id="object-name-row" style="display: none;">
      <label for="node-input-objectName"><i class="fa fa-file"></i> Object Name</label>
      <input type="text" id="node-input-objectName" placeholder="my-object.txt" style="width:70%">
    </div>
    <div class="form-row">
      <label for="node-input-outputFormat"><i class="fa fa-code"></i> Output Format</label>
      <select id="node-input-outputFormat" style="width:70%">
        <option value="buffer">Buffer</option>
        <option value="string">String</option>
        <option value="json">JSON (auto-parse)</option>
      </select>
    </div>
  </div>
</script>

<script type="text/markdown" data-help-name="nats-suite-object-get">
Downloads objects from a NATS JetStream Object Store bucket.

### Outputs

: payload (buffer | string | object) : the object data, shaped by the configured output format
: info (object) : object metadata (size, chunks, etc.)
: size (number) : object size in bytes
</script>
