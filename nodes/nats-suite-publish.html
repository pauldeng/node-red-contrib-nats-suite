<script type="text/javascript">
  RED.nodes.registerType('nats-suite-publish', {
    category: 'NATS Suite',
    color: '#2FAF9C',
    defaults: {
      name: { value: '' },
      server: { value: '', type: 'nats-suite-server' },
      debug: { value: false },
      mode: { value: 'publish' }, // 'publish', 'reply', 'request'
      dataformat: { value: 'json', required: true },
      datapointid: { value: '' },
      enableTopicOverride: { value: false },
      requestTimeout: { value: 5000 },
      requestFallbackToPublish: { value: true },
      enableAutoReply: { value: false },
      enableHeaders: { value: false },
      headers: { value: '' }
    },
    inputs: 1,
    outputs: 0,
    icon: 'nats-icon-white.png',
    align: 'right',
    label: function () {
      return this.name || 'nats publish';
    },
    paletteLabel: 'nats publish',
    oneditprepare: function() {
      // Collapsible sections
      $('.nats-section-header').on('click', function() {
        const $header = $(this);
        const $content = $header.next('.nats-section-content');
        const $icon = $header.find('.nats-section-toggle');
        
        $content.slideToggle(200);
        $icon.toggleClass('fa-chevron-down fa-chevron-right');
        $header.toggleClass('collapsed');
      });
      
      // Headers configuration
      $('#node-input-enableHeaders').on('change', function() {
        if ($(this).is(':checked')) {
          $('#headers-options').slideDown(200);
        } else {
          $('#headers-options').slideUp(200);
        }
      });

      const updateOutputs = () => {
        const mode = $('#node-input-mode').val();
        this.outputs = (mode === 'request' ||
          (mode === 'reply' && $('#node-input-enableAutoReply').is(':checked'))) ? 1 : 0;
      };

      const updateAutoReply = mode => {
        $('#node-input-enableAutoReply').prop('disabled', mode !== 'reply');
      };

      // Mode configuration - affects outputs and visibility
      $('#node-input-mode').on('change', function() {
        const mode = $(this).val();

        // Show/hide request timeout section
        if (mode === 'request') {
          $('#requestreply-options').slideDown(200);
        } else {
          $('#requestreply-options').slideUp(200);
        }

        // Show/hide subject field and topic override (hidden in reply mode as it comes from msg._reply)
        if (mode === 'reply') {
          $('#subject-row').slideUp(200);
          $('#topic-override-row').slideUp(200);
        } else {
          $('#subject-row').slideDown(200);
          $('#topic-override-row').slideDown(200);
        }
        updateAutoReply(mode);
        updateOutputs();
      });

      $('#node-input-enableAutoReply').on('change', updateOutputs);

      // Trigger initial state
      $('#node-input-mode').trigger('change');
      $('#node-input-enableHeaders').trigger('change');
      $('#node-input-enableAutoReply').trigger('change');
    },

    oneditsave: function() {
      const mode = $('#node-input-mode').val();
      
      this.outputs = (mode === 'request' ||
        (mode === 'reply' && $('#node-input-enableAutoReply').is(':checked'))) ? 1 : 0;
    }
  });
</script>

<script type="text/markdown" data-help-name="nats-suite-publish">
Publishes messages to NATS subjects with advanced features.

### Inputs

: payload (any) : The data to publish. Format depends on the selected data format.
: topic (string, optional) : Override the configured NATS subject (only if "Allow msg.topic to override subject" is enabled in publish/request modes).
: headers (object, optional) : Dynamic NATS headers to include with the message.
: _reply / _unsreply (string, optional) : Reply-to subject used when mode is set to "Reply".

### Data Formats

 - **JSON:** Automatically stringifies objects
 - **String:** Sends payload as-is
 - **Buffer:** Binary data support

### Features

#### Message Headers

Add custom NATS headers to messages. Static headers configured in the node are merged with dynamic headers from `msg.headers`.

```
msg.headers = {
  "X-User": "john",
  "X-Request-ID": "abc123"
};
```

#### Request-Reply Mode (Client Side)

Enables the NATS request-reply pattern. The node sends a request to the configured subject and waits for a reply.

 - Automatically generates a unique inbox subject for the reply
 - Waits for response up to the configured timeout
 - Reply message appears at the node output
 - On timeout: `msg.error` contains timeout information

```
// Input
msg.payload = { action: "getData", id: 123 };
msg.topic = "my.service";

// Output (on success)
msg.payload = { result: "data..." };
msg.requestTime = 45; // ms

// Output (on timeout)
msg.error = { message: "Request timeout", code: "TIMEOUT" };
```

#### Auto-Reply Handler (Service Side)

For building services in Reply mode: forwards the incoming message to the output unchanged. When the processed response is looped back into this node's input, it is published back to the request's reply subject.

### Subject Wildcards

 - `*` - matches a single token (e.g., `sensor.*.temperature`)
 - `>` - matches one or more tokens (e.g., `sensor.>`)
